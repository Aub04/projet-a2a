[project]
name = "a2a-team"
version = "0.1.0"
description = "Comparaison pair-à-pair vs orchestrateur pour un système multi-agents A2A"
readme = "README.md"
authors = [
    { name = "aub1", email = "aherault.ing2027@esaip.org" }
]
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "ollama==0.6.3",
    "openai==3.52.0",
    "pandas==3.1.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "streamlit==1.67.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
